# Unit tests for the Artie CAN library.
#
# The artie-can-test-image build task produces an image that compiles the C library and its
# Unity test suite; this task runs that suite (via ctest) inside a single container and then
# checks the container's logs for each individual test's result, so that every test shows up
# separately in the test report.
#
# The tests exercise all four Artie CAN protocols against the UDP multicast backend, which
# simulates a CAN bus between several nodes inside the container.
#
# NOTE: Each test must be listed here to be tracked, so this file needs to be updated whenever
# a RUN_TEST() is added to or removed from framework/ardk/libraries/artie-can/tests.
name: artie-can-unit-tests
labels:
  - docker-image
  - unit
  - library
dependencies:
  - artie-can-test-image: docker-image
type: test
steps:
  - job: single-container-pytest-suite
    docker-image-under-test:
      dependency:
        name: docker-image
        producing-task: artie-can-test-image
    # No cmd-to-run-in-dut: the test image's default command already runs the whole suite
    # ('ctest -V'), which prints a '<file>:<line>:<test-name>:PASS' line per test.
    steps:

      # RTACP: real-time addressed messaging (test_rtacp.c)
      - test-name: test_broadcast
        expected-outputs:
          - what: "test_broadcast:PASS"
            where: ${DUT}
      - test-name: test_send_to_specific_address
        expected-outputs:
          - what: "test_send_to_specific_address:PASS"
            where: ${DUT}
      - test-name: test_send_to_specific_address_only_received_by_target
        expected-outputs:
          - what: "test_send_to_specific_address_only_received_by_target:PASS"
            where: ${DUT}
      - test-name: test_send_multiple_messages
        expected-outputs:
          - what: "test_send_multiple_messages:PASS"
            where: ${DUT}
      - test-name: test_echo_message
        expected-outputs:
          - what: "test_echo_message:PASS"
            where: ${DUT}
      - test-name: test_send_lots_of_messages
        expected-outputs:
          - what: "test_send_lots_of_messages:PASS"
            where: ${DUT}

      # BWACP: multi-frame block writes (test_bwacp.c)
      - test-name: test_send_one_byte
        expected-outputs:
          - what: "test_send_one_byte:PASS"
            where: ${DUT}
      - test-name: test_send_four_bytes
        expected-outputs:
          - what: "test_send_four_bytes:PASS"
            where: ${DUT}
      - test-name: test_send_eight_bytes
        expected-outputs:
          - what: "test_send_eight_bytes:PASS"
            where: ${DUT}
      - test-name: test_send_254_bytes
        expected-outputs:
          - what: "test_send_254_bytes:PASS"
            where: ${DUT}
      - test-name: test_send_255_bytes
        expected-outputs:
          - what: "test_send_255_bytes:PASS"
            where: ${DUT}
      - test-name: test_send_256_bytes
        expected-outputs:
          - what: "test_send_256_bytes:PASS"
            where: ${DUT}
      - test-name: test_send_257_bytes
        expected-outputs:
          - what: "test_send_257_bytes:PASS"
            where: ${DUT}
      - test-name: test_crc_mismatch
        expected-outputs:
          - what: "test_crc_mismatch:PASS"
            where: ${DUT}
      - test-name: test_one_target_node
        expected-outputs:
          - what: "test_one_target_node:PASS"
            where: ${DUT}
      - test-name: test_class_of_target_nodes
        expected-outputs:
          - what: "test_class_of_target_nodes:PASS"
            where: ${DUT}
      - test-name: test_rtacp_while_bwacp
        expected-outputs:
          - what: "test_rtacp_while_bwacp:PASS"
            where: ${DUT}
      - test-name: test_concurrent_bwacp
        expected-outputs:
          - what: "test_concurrent_bwacp:PASS"
            where: ${DUT}
      - test-name: test_send_46k_bytes
        expected-outputs:
          - what: "test_send_46k_bytes:PASS"
            where: ${DUT}

      # PSACP: publish/subscribe (test_psacp.c)
      - test-name: test_publish_to_non_subscribed_topic
        expected-outputs:
          - what: "test_publish_to_non_subscribed_topic:PASS"
            where: ${DUT}
      - test-name: test_publish_broadcast
        expected-outputs:
          - what: "test_publish_broadcast:PASS"
            where: ${DUT}
      - test-name: test_publish_to_subscribed_topic
        expected-outputs:
          - what: "test_publish_to_subscribed_topic:PASS"
            where: ${DUT}
      - test-name: test_psacp_high_priority_during_bwacp
        expected-outputs:
          - what: "test_psacp_high_priority_during_bwacp:PASS"
            where: ${DUT}
      # These two are TEST_IGNORE_MESSAGE("Not yet implemented") stubs, so they report IGNORE
      # rather than PASS. They are tracked anyway so that this file stays a complete mirror of the
      # suite; when they get implemented, this task will fail until these are flipped over to
      # ':PASS' like the rest.
      - test-name: test_bwacp_unaffected_by_low_priority_psacp_noise
        expected-outputs:
          - what: "test_bwacp_unaffected_by_low_priority_psacp_noise:IGNORE"
            where: ${DUT}
      - test-name: test_unsubscribe
        expected-outputs:
          - what: "test_unsubscribe:IGNORE"
            where: ${DUT}

      # PSACP multi-frame messages: a payload larger than one CAN frame is fragmented across
      # PUB_START/PUB_MORE/PUB_END and reassembled by the receiver. The sizes below sit on the
      # boundaries the fragmentation arithmetic turns on.
      - test-name: test_publish_message_single_frame
        expected-outputs:
          - what: "test_publish_message_single_frame:PASS"
            where: ${DUT}
      - test-name: test_publish_message_nine_bytes
        expected-outputs:
          - what: "test_publish_message_nine_bytes:PASS"
            where: ${DUT}
      - test-name: test_publish_message_fifteen_bytes
        expected-outputs:
          - what: "test_publish_message_fifteen_bytes:PASS"
            where: ${DUT}
      - test-name: test_publish_message_sixteen_bytes
        expected-outputs:
          - what: "test_publish_message_sixteen_bytes:PASS"
            where: ${DUT}
      - test-name: test_publish_message_one_hundred_bytes
        expected-outputs:
          - what: "test_publish_message_one_hundred_bytes:PASS"
            where: ${DUT}
      - test-name: test_publish_message_max_size
        expected-outputs:
          - what: "test_publish_message_max_size:PASS"
            where: ${DUT}
      - test-name: test_publish_message_too_large_is_rejected
        expected-outputs:
          - what: "test_publish_message_too_large_is_rejected:PASS"
            where: ${DUT}
      - test-name: test_publish_message_high_priority_multi_frame_is_rejected
        expected-outputs:
          - what: "test_publish_message_high_priority_multi_frame_is_rejected:PASS"
            where: ${DUT}

      # PSACP frame loss (test_psacp_frame_loss.c): PSACP has no ACK, so a lost fragment cannot be
      # recovered - what these pin down is that a damaged message is always *dropped* rather than
      # delivered short. test_lost_final_fragment_drops_the_message is the one the wire format
      # turns on: PUB_END carries no fragment index, so only the count PUB_START promises catches a
      # missing last fragment.
      - test-name: test_intact_message_is_delivered
        expected-outputs:
          - what: "test_intact_message_is_delivered:PASS"
            where: ${DUT}
      - test-name: test_lost_interior_fragment_drops_the_message
        expected-outputs:
          - what: "test_lost_interior_fragment_drops_the_message:PASS"
            where: ${DUT}
      - test-name: test_lost_final_fragment_drops_the_message
        expected-outputs:
          - what: "test_lost_final_fragment_drops_the_message:PASS"
            where: ${DUT}
      - test-name: test_lost_start_drops_the_message
        expected-outputs:
          - what: "test_lost_start_drops_the_message:PASS"
            where: ${DUT}
      - test-name: test_lost_end_drops_the_message
        expected-outputs:
          - what: "test_lost_end_drops_the_message:PASS"
            where: ${DUT}
      - test-name: test_slot_recovers_after_a_timeout
        expected-outputs:
          - what: "test_slot_recovers_after_a_timeout:PASS"
            where: ${DUT}
      - test-name: test_new_message_reclaims_an_abandoned_slot
        expected-outputs:
          - what: "test_new_message_reclaims_an_abandoned_slot:PASS"
            where: ${DUT}
      - test-name: test_single_frame_publish_is_unaffected
        expected-outputs:
          - what: "test_single_frame_publish_is_unaffected:PASS"
            where: ${DUT}

      # RPCACP: remote procedure calls (test_rpcacp.c)
      - test-name: test_rpcacp_whoami_function
        expected-outputs:
          - what: "test_rpcacp_whoami_function:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_status_function
        expected-outputs:
          - what: "test_rpcacp_status_function:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_list_function
        expected-outputs:
          - what: "test_rpcacp_list_function:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_invalid_function_id
        expected-outputs:
          - what: "test_rpcacp_invalid_function_id:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_too_many_parameters
        expected-outputs:
          - what: "test_rpcacp_too_many_parameters:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_invalid_parameters
        expected-outputs:
          - what: "test_rpcacp_invalid_parameters:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_no_args_no_return
        expected-outputs:
          - what: "test_rpcacp_no_args_no_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_uint8_args_uint8_return
        expected-outputs:
          - what: "test_rpcacp_uint8_args_uint8_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_uint16_args_uint16_return
        expected-outputs:
          - what: "test_rpcacp_uint16_args_uint16_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_uint32_args_uint32_return
        expected-outputs:
          - what: "test_rpcacp_uint32_args_uint32_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_uint64_args_uint64_return
        expected-outputs:
          - what: "test_rpcacp_uint64_args_uint64_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_int8_args_int8_return
        expected-outputs:
          - what: "test_rpcacp_int8_args_int8_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_int16_args_int16_return
        expected-outputs:
          - what: "test_rpcacp_int16_args_int16_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_int32_args_int32_return
        expected-outputs:
          - what: "test_rpcacp_int32_args_int32_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_int64_args_int64_return
        expected-outputs:
          - what: "test_rpcacp_int64_args_int64_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_float_args_float_return
        expected-outputs:
          - what: "test_rpcacp_float_args_float_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_double_args_double_return
        expected-outputs:
          - what: "test_rpcacp_double_args_double_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_array_args_array_return
        expected-outputs:
          - what: "test_rpcacp_array_args_array_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_struct_args_struct_return
        expected-outputs:
          - what: "test_rpcacp_struct_args_struct_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_string_args_string_return
        expected-outputs:
          - what: "test_rpcacp_string_args_string_return:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_async_call
        expected-outputs:
          - what: "test_rpcacp_async_call:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_async_call_busy_async
        expected-outputs:
          - what: "test_rpcacp_async_call_busy_async:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_async_call_busy_sync
        expected-outputs:
          - what: "test_rpcacp_async_call_busy_sync:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_async_call_multiple_nodes
        expected-outputs:
          - what: "test_rpcacp_async_call_multiple_nodes:PASS"
            where: ${DUT}
      - test-name: test_rpcacp_15_parameters
        expected-outputs:
          - what: "test_rpcacp_15_parameters:PASS"
            where: ${DUT}

      # Suite-level guard: catches a test binary that dies part way through after having
      # already logged some passing tests.
      - test-name: whole-suite-passed
        expected-outputs:
          - what: "100% tests passed, 0 tests failed"
            where: ${DUT}
