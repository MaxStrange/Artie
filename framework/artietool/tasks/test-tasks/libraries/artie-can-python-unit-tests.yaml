# Unit tests for the Artie CAN library's Python bindings.
#
# These are the sibling of artie-can-unit-tests: that task runs the C library's Unity suite via
# ctest, this one runs the pytest suite over the `artie_can` package that wraps it. Both use the
# same artie-can-test-image, which carries the built C library, the Python package (installed by
# the base image) and pytest.
#
# The suite stands several nodes up inside a single container on the UDP multicast backend, which
# simulates a CAN bus between them. Frames never leave that process, so what is covered here is the
# bindings and the protocol state machines underneath them; frames actually crossing a network is
# what can-python-integration-tests covers.
#
# NOTE: Each test must be listed here to be tracked, so this file needs to be updated whenever a
# test is added to or removed from framework/ardk/libraries/artie-can/tests/python. The
# whole-suite-passed step at the end is what catches a test this file has not been told about
# failing anyway.
name: artie-can-python-unit-tests
labels:
  - docker-image
  - unit
  - library
dependencies:
  - artie-can-test-image: docker-image
type: test
steps:
  - job: single-container-pytest-suite
    docker-image-under-test:
      dependency:
        name: docker-image
        producing-task: artie-can-test-image
    # The image's default command runs the C suite, so the Python one is asked for explicitly.
    # run_tests.py passes -v to pytest, which is what produces the '<test name> PASSED' line per
    # test that the steps below grep for.
    cmd-to-run-in-dut: "python /artie-can/run_tests.py"
    steps:

      # Error codes and exceptions: the C library reports failures as a bit mask,
      # and these cover keeping the whole mask while still choosing a useful exception from it.
      - test-name: test_success_code_is_falsy
        expected-outputs:
          - what: "test_success_code_is_falsy PASSED"
            where: ${DUT}
      - test-name: test_check_returns_quietly_on_success
        expected-outputs:
          - what: "test_check_returns_quietly_on_success PASSED"
            where: ${DUT}
      - test-name: test_check_raises_the_matching_exception
        expected-outputs:
          - what: "test_check_raises_the_matching_exception PASSED"
            where: ${DUT}
      - test-name: test_exception_carries_flags_and_operation
        expected-outputs:
          - what: "test_exception_carries_flags_and_operation PASSED"
            where: ${DUT}
      - test-name: test_compound_mask_picks_the_most_fundamental_failure
        expected-outputs:
          - what: "test_compound_mask_picks_the_most_fundamental_failure PASSED"
            where: ${DUT}
      - test-name: test_unrecognized_code_falls_back_to_the_base_error
        expected-outputs:
          - what: "test_unrecognized_code_falls_back_to_the_base_error PASSED"
            where: ${DUT}
      - test-name: test_retriable_only_when_every_flag_is
        expected-outputs:
          - what: "test_retriable_only_when_every_flag_is PASSED"
            where: ${DUT}
      - test-name: test_exceptions_double_as_their_builtin_equivalents
        expected-outputs:
          - what: "test_exceptions_double_as_their_builtin_equivalents PASSED"
            where: ${DUT}
      - test-name: test_remote_error_carries_the_nodes_errno
        expected-outputs:
          - what: "test_remote_error_carries_the_nodes_errno PASSED"
            where: ${DUT}

      # Frame packing and parsing, which goes through the C library's own pack/parse
      # functions so that the Python side cannot disagree with the wire format.
      - test-name: test_frame_rejects_more_data_than_fits
        expected-outputs:
          - what: "test_frame_rejects_more_data_than_fits PASSED"
            where: ${DUT}
      - test-name: test_frame_decodes_the_fields_packed_into_its_id
        expected-outputs:
          - what: "test_frame_decodes_the_fields_packed_into_its_id PASSED"
            where: ${DUT}
      - test-name: test_frame_repr_shows_its_id_and_payload
        expected-outputs:
          - what: "test_frame_repr_shows_its_id_and_payload PASSED"
            where: ${DUT}
      - test-name: test_rtacp_message_survives_the_round_trip
        expected-outputs:
          - what: "test_rtacp_message_survives_the_round_trip PASSED"
            where: ${DUT}
      - test-name: test_rtacp_empty_payload_survives_the_round_trip
        expected-outputs:
          - what: "test_rtacp_empty_payload_survives_the_round_trip PASSED"
            where: ${DUT}
      - test-name: test_rtacp_message_knows_when_it_is_a_broadcast
        expected-outputs:
          - what: "test_rtacp_message_knows_when_it_is_a_broadcast PASSED"
            where: ${DUT}
      - test-name: test_psacp_message_survives_the_round_trip
        expected-outputs:
          - what: "test_psacp_message_survives_the_round_trip PASSED"
            where: ${DUT}
      - test-name: test_psacp_high_priority_uses_its_own_protocol_id
        expected-outputs:
          - what: "test_psacp_high_priority_uses_its_own_protocol_id PASSED"
            where: ${DUT}
      - test-name: test_block_write_reports_its_size
        expected-outputs:
          - what: "test_block_write_reports_its_size PASSED"
            where: ${DUT}

      # RPC signatures and parameter marshalling - the contract both ends of a call
      # have to agree on. No bus involved.
      - test-name: test_primitive_parameters_survive_the_round_trip
        expected-outputs:
          - what: "test_primitive_parameters_survive_the_round_trip PASSED"
            where: ${DUT}
      - test-name: test_float_parameters_survive_the_round_trip
        expected-outputs:
          - what: "test_float_parameters_survive_the_round_trip PASSED"
            where: ${DUT}
      - test-name: test_float_and_double_are_narrowed_on_the_wire
        expected-outputs:
          - what: "test_float_and_double_are_narrowed_on_the_wire PASSED"
            where: ${DUT}
      - test-name: test_out_of_range_value_is_rejected
        expected-outputs:
          - what: "test_out_of_range_value_is_rejected PASSED"
            where: ${DUT}
      - test-name: test_non_primitive_type_needs_an_explicit_size
        expected-outputs:
          - what: "test_non_primitive_type_needs_an_explicit_size PASSED"
            where: ${DUT}
      - test-name: test_non_primitive_type_is_passed_through_as_raw_bytes
        expected-outputs:
          - what: "test_non_primitive_type_is_passed_through_as_raw_bytes PASSED"
            where: ${DUT}
      - test-name: test_raw_value_of_the_wrong_size_is_rejected
        expected-outputs:
          - what: "test_raw_value_of_the_wrong_size_is_rejected PASSED"
            where: ${DUT}
      - test-name: test_void_parameter_carries_nothing
        expected-outputs:
          - what: "test_void_parameter_carries_nothing PASSED"
            where: ${DUT}
      - test-name: test_parameters_are_laid_out_back_to_back
        expected-outputs:
          - what: "test_parameters_are_laid_out_back_to_back PASSED"
            where: ${DUT}
      - test-name: test_signature_rejects_more_parameters_than_the_protocol_carries
        expected-outputs:
          - what: "test_signature_rejects_more_parameters_than_the_protocol_carries PASSED"
            where: ${DUT}
      - test-name: test_variable_length_parameter_must_come_last
        expected-outputs:
          - what: "test_variable_length_parameter_must_come_last PASSED"
            where: ${DUT}
      - test-name: test_extra_arguments_are_rejected
        expected-outputs:
          - what: "test_extra_arguments_are_rejected PASSED"
            where: ${DUT}
      - test-name: test_missing_required_argument_is_rejected
        expected-outputs:
          - what: "test_missing_required_argument_is_rejected PASSED"
            where: ${DUT}
      - test-name: test_trailing_optional_arguments_may_be_omitted
        expected-outputs:
          - what: "test_trailing_optional_arguments_may_be_omitted PASSED"
            where: ${DUT}
      - test-name: test_procedure_info_reports_unassigned_ids_as_unregistered
        expected-outputs:
          - what: "test_procedure_info_reports_unassigned_ids_as_unregistered PASSED"
            where: ${DUT}

      # Node construction and lifecycle.
      - test-name: test_address_must_be_one_a_node_can_have
        expected-outputs:
          - what: "test_address_must_be_one_a_node_can_have PASSED"
            where: ${DUT}
      - test-name: test_a_node_must_take_part_in_something
        expected-outputs:
          - what: "test_a_node_must_take_part_in_something PASSED"
            where: ${DUT}
      - test-name: test_block_buffer_must_have_room_for_something
        expected-outputs:
          - what: "test_block_buffer_must_have_room_for_something PASSED"
            where: ${DUT}
      - test-name: test_name_defaults_to_the_address
        expected-outputs:
          - what: "test_name_defaults_to_the_address PASSED"
            where: ${DUT}
      - test-name: test_auto_open_can_be_deferred
        expected-outputs:
          - what: "test_auto_open_can_be_deferred PASSED"
            where: ${DUT}
      - test-name: test_open_and_close_are_both_idempotent
        expected-outputs:
          - what: "test_open_and_close_are_both_idempotent PASSED"
            where: ${DUT}
      - test-name: test_node_works_as_a_context_manager
        expected-outputs:
          - what: "test_node_works_as_a_context_manager PASSED"
            where: ${DUT}
      - test-name: test_repr_reports_the_address_and_whether_it_is_open
        expected-outputs:
          - what: "test_repr_reports_the_address_and_whether_it_is_open PASSED"
            where: ${DUT}
      - test-name: test_configuration_is_reported_back
        expected-outputs:
          - what: "test_configuration_is_reported_back PASSED"
            where: ${DUT}
      - test-name: test_methods_for_protocols_the_node_skipped_are_rejected
        expected-outputs:
          - what: "test_methods_for_protocols_the_node_skipped_are_rejected PASSED"
            where: ${DUT}
      - test-name: test_using_a_closed_node_raises_rather_than_hanging
        expected-outputs:
          - what: "test_using_a_closed_node_raises_rather_than_hanging PASSED"
            where: ${DUT}
      - test-name: test_block_buffer_is_the_size_that_was_asked_for
        expected-outputs:
          - what: "test_block_buffer_is_the_size_that_was_asked_for PASSED"
            where: ${DUT}
      - test-name: test_a_quiet_node_reports_no_background_errors
        expected-outputs:
          - what: "test_a_quiet_node_reports_no_background_errors PASSED"
            where: ${DUT}
      - test-name: test_block_write_timeout_grows_with_the_payload
        expected-outputs:
          - what: "test_block_write_timeout_grows_with_the_payload PASSED"
            where: ${DUT}

      # RTACP: small, latency-sensitive messages, unicast and broadcast.
      - test-name: test_rtacp_unicast_reaches_its_target
        expected-outputs:
          - what: "test_rtacp_unicast_reaches_its_target PASSED"
            where: ${DUT}
      - test-name: test_rtacp_broadcast_reaches_every_node
        expected-outputs:
          - what: "test_rtacp_broadcast_reaches_every_node PASSED"
            where: ${DUT}
      - test-name: test_rtacp_priority_survives_the_wire
        expected-outputs:
          - what: "test_rtacp_priority_survives_the_wire PASSED"
            where: ${DUT}
      - test-name: test_rtacp_message_is_handed_to_the_callback
        expected-outputs:
          - what: "test_rtacp_message_is_handed_to_the_callback PASSED"
            where: ${DUT}
      - test-name: test_rtacp_receive_and_callback_are_alternatives
        expected-outputs:
          - what: "test_rtacp_receive_and_callback_are_alternatives PASSED"
            where: ${DUT}
      - test-name: test_rtacp_receive_times_out_on_a_silent_bus
        expected-outputs:
          - what: "test_rtacp_receive_times_out_on_a_silent_bus PASSED"
            where: ${DUT}
      - test-name: test_rtacp_rejects_more_than_one_frame_of_data
        expected-outputs:
          - what: "test_rtacp_rejects_more_than_one_frame_of_data PASSED"
            where: ${DUT}

      # PSACP: fire-and-forget publish/subscribe on numbered topics.
      - test-name: test_publish_reaches_a_subscriber
        expected-outputs:
          - what: "test_publish_reaches_a_subscriber PASSED"
            where: ${DUT}
      - test-name: test_publish_on_an_unsubscribed_topic_is_not_delivered
        expected-outputs:
          - what: "test_publish_on_an_unsubscribed_topic_is_not_delivered PASSED"
            where: ${DUT}
      - test-name: test_broadcast_topic_reaches_every_subscriber
        expected-outputs:
          - what: "test_broadcast_topic_reaches_every_subscriber PASSED"
            where: ${DUT}
      - test-name: test_high_priority_publish_arrives_marked_as_such
        expected-outputs:
          - what: "test_high_priority_publish_arrives_marked_as_such PASSED"
            where: ${DUT}
      - test-name: test_publish_is_handed_to_the_callback
        expected-outputs:
          - what: "test_publish_is_handed_to_the_callback PASSED"
            where: ${DUT}
      - test-name: test_publish_rejects_more_than_a_whole_message
        expected-outputs:
          - what: "test_publish_rejects_more_than_a_whole_message PASSED"
            where: ${DUT}

      # PSACP multi-frame messages: a payload over one frame's worth is fragmented on the wire and
      # reassembled by the receiver, which the Node API hides entirely - publish() and
      # receive_psacp() look the same whatever the size. The parametrised sizes sit on the
      # boundaries of the fragmentation arithmetic, 527 being the largest the protocol allows.
      - test-name: test_message_of_any_size_survives_the_round_trip[8]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[8] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[9]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[9] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[15]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[15] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[16]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[16] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[100]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[100] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[526]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[526] PASSED"
            where: ${DUT}
      - test-name: test_message_of_any_size_survives_the_round_trip[527]
        expected-outputs:
          - what: "test_message_of_any_size_survives_the_round_trip[527] PASSED"
            where: ${DUT}
      - test-name: test_multi_frame_message_is_handed_to_the_callback
        expected-outputs:
          - what: "test_multi_frame_message_is_handed_to_the_callback PASSED"
            where: ${DUT}
      - test-name: test_multi_frame_publish_is_rejected_at_high_priority
        expected-outputs:
          - what: "test_multi_frame_publish_is_rejected_at_high_priority PASSED"
            where: ${DUT}
      - test-name: test_concurrent_publishers_on_one_topic_are_not_spliced
        expected-outputs:
          - what: "test_concurrent_publishers_on_one_topic_are_not_spliced PASSED"
            where: ${DUT}
      - test-name: test_publisher_subscribed_to_its_own_topic_receives_its_message
        expected-outputs:
          - what: "test_publisher_subscribed_to_its_own_topic_receives_its_message PASSED"
            where: ${DUT}

      # BWACP: bulk block writes, which span many frames and are only reported once
      # the whole transfer has landed and its CRC checks out.
      - test-name: test_block_write_lands_in_the_receivers_buffer
        expected-outputs:
          - what: "test_block_write_lands_in_the_receivers_buffer PASSED"
            where: ${DUT}
      - test-name: test_completed_transfer_is_reported_with_its_payload
        expected-outputs:
          - what: "test_completed_transfer_is_reported_with_its_payload PASSED"
            where: ${DUT}
      - test-name: test_block_write_honours_the_offset_it_was_given
        expected-outputs:
          - what: "test_block_write_honours_the_offset_it_was_given PASSED"
            where: ${DUT}
      - test-name: test_multicast_block_write_reaches_only_the_addressed_class
        expected-outputs:
          - what: "test_multicast_block_write_reaches_only_the_addressed_class PASSED"
            where: ${DUT}
      - test-name: test_completed_transfer_is_handed_to_the_callback
        expected-outputs:
          - what: "test_completed_transfer_is_handed_to_the_callback PASSED"
            where: ${DUT}
      - test-name: test_receive_block_and_callback_are_alternatives
        expected-outputs:
          - what: "test_receive_block_and_callback_are_alternatives PASSED"
            where: ${DUT}
      - test-name: test_block_write_must_carry_something
        expected-outputs:
          - what: "test_block_write_must_carry_something PASSED"
            where: ${DUT}

      # RPCACP: remote procedure calls, both the standard ones every node answers
      # internally and device-specific ones.
      - test-name: test_whoami_reports_the_nodes_identity
        expected-outputs:
          - what: "test_whoami_reports_the_nodes_identity PASSED"
            where: ${DUT}
      - test-name: test_status_reports_uptime
        expected-outputs:
          - what: "test_status_reports_uptime PASSED"
            where: ${DUT}
      - test-name: test_status_reports_the_error_flags_the_node_set
        expected-outputs:
          - what: "test_status_reports_the_error_flags_the_node_set PASSED"
            where: ${DUT}
      - test-name: test_list_reports_the_standard_procedures
        expected-outputs:
          - what: "test_list_reports_the_standard_procedures PASSED"
            where: ${DUT}
      - test-name: test_list_reports_the_procedures_a_node_registered
        expected-outputs:
          - what: "test_list_reports_the_procedures_a_node_registered PASSED"
            where: ${DUT}
      - test-name: test_call_returns_what_the_procedure_returned
        expected-outputs:
          - what: "test_call_returns_what_the_procedure_returned PASSED"
            where: ${DUT}
      - test-name: test_call_passes_every_argument_through
        expected-outputs:
          - what: "test_call_passes_every_argument_through PASSED"
            where: ${DUT}
      - test-name: test_call_of_a_void_procedure_returns_nothing
        expected-outputs:
          - what: "test_call_of_a_void_procedure_returns_nothing PASSED"
            where: ${DUT}
      - test-name: test_asynchronous_call_returns_before_the_procedure_has_run
        expected-outputs:
          - what: "test_asynchronous_call_returns_before_the_procedure_has_run PASSED"
            where: ${DUT}
      - test-name: test_calling_an_unknown_procedure_is_rejected_by_the_remote
        expected-outputs:
          - what: "test_calling_an_unknown_procedure_is_rejected_by_the_remote PASSED"
            where: ${DUT}
      - test-name: test_a_procedure_that_raises_is_reported_back_to_the_caller
        expected-outputs:
          - what: "test_a_procedure_that_raises_is_reported_back_to_the_caller PASSED"
            where: ${DUT}
      - test-name: test_there_is_no_such_thing_as_a_broadcast_call
        expected-outputs:
          - what: "test_there_is_no_such_thing_as_a_broadcast_call PASSED"
            where: ${DUT}
      - test-name: test_registering_needs_something_to_run
        expected-outputs:
          - what: "test_registering_needs_something_to_run PASSED"
            where: ${DUT}

      # Suite-level guard: run_tests.py prints this only when pytest exited zero, so it catches a
      # suite that died part way through after already logging some passing tests, and a failure in
      # a test this file has not been told about.
      - test-name: whole-suite-passed
        expected-outputs:
          - what: "PYTEST SUITE:PASS"
            where: ${DUT}
