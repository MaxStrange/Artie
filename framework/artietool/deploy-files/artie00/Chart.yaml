apiVersion: v2
name: artie00
description: Artie00 - a specific Artie robot. Adds Artie00's hardware drivers on top of the artie-base platform services.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "3d23200b"

icon: https://github.com/MaxStrange/artie-controller-node/blob/dev/assets/splash.png

# No chart dependencies on purpose. artie00 is deployed as its own release alongside the
# artie-base release, rather than pulling artie-base in as a subchart. That keeps the two
# charts independently ownable once they live in separate repositories - artie-base with
# ArDK, artie00 with the robot - and avoids needing a cross-repository chart reference.
# Artie Tool installs both and keeps the shared overridable values consistent.
