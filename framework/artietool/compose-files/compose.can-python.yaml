name: can-python-integration-test
networks:
  can-python-itest:
    external: true

# Two long-lived Artie CAN peer nodes driven through the Python bindings, each in its own
# container, sharing a UDP multicast bus over the can-python-itest bridge network. The third node
# (address 0x01) is the one-shot scenario driver that the can-python-integration-tests task runs
# per test step, so it is not declared here.
#
# This is the Python twin of compose.can.yaml. The two run on separate networks *and* separate
# multicast groups (239.0.0.10 there, 239.0.0.11 here), so the C and Python integration suites
# cannot hear each other even if they run at the same time on one host.
#
# Node addresses must stay unique across all three: the UDP multicast backend filters out its own
# traffic by comparing each frame's source address against its own node address, so two nodes
# sharing an address would silently discard each other's frames.
services:
  can-python-node-2:
    container_name: can-python-itest-node-2
    image: ${ARTIE_CAN_TEST_IMAGE}
    command: python /artie-can/itest/itest_node.py --role peer --address 0x02
    networks:
      - can-python-itest
    environment:
      - ARTIE_RUN_MODE=integration
      - ARTIE_LOG_LEVEL=DEBUG
      # The task reads these containers' logs, so nothing may sit in a stdio buffer.
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f itest_node.py > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  can-python-node-3:
    container_name: can-python-itest-node-3
    image: ${ARTIE_CAN_TEST_IMAGE}
    command: python /artie-can/itest/itest_node.py --role peer --address 0x03
    networks:
      - can-python-itest
    environment:
      - ARTIE_RUN_MODE=integration
      - ARTIE_LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f itest_node.py > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
