[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "artiecli"
readme = "README.md"
version = "0.0.1"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "artie-tooling>=0.0.1",
    "artie-service-client>=0.0.1",
    "artie-util>=0.0.1",
    "artie-i2c>=0.0.1",
    "urllib3<2.0.0",
    "requests>=2.28.0",
    # cli.py imports every module in modules/ at import time, so modules/service.py's
    # top-level rpyc import is required for artie-cli to start at all - it is not optional.
    "rpyc==6.0.1",
]

[project.optional-dependencies]
# artie_can is a compiled extension that is not present in every environment artie-cli
# runs in, so modules/can.py imports it lazily, per command.
can = ["artie-can>=0.1.0"]
# Retained for backwards compatibility: rpyc is now a hard dependency.
remote = ["rpyc==6.0.1"]

[project.scripts]
artie-cli = "artiecli.cli:main"
