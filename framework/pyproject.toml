[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "artietool"
readme = "artietool/README.md"
version = "0.0.1"
requires-python = ">=3.10"
license = { text = "MIT" }
description = "Build system, test harness, and release pipeline for the Artie robotics platform."
dependencies = [
    "docker>=7.1.0",
    "requests",
    "rpyc==6.0.1",
    "pyyaml",
    "kubernetes==28.*",
    "fabric",
    # Was the relative path dependency './ardk/libraries/artie-tooling' in
    # requirements.txt. Declared by name so that Artie Tool can be installed from
    # outside a checkout of the Artie repo.
    "artie-tooling>=0.0.1",
]

[project.scripts]
artie-tool = "artietool.cli:main"

[tool.setuptools.packages.find]
# framework/ also holds ardk/, cli/, workbench/ and daemons/, which are separate
# distributions. Only ship Artie Tool's own packages from here.
include = ["artietool*"]

[tool.setuptools.package-data]
# Task definitions, Helm charts and compose files are data, not importable modules,
# but Artie Tool reads them at runtime so they have to ship with the wheel.
artietool = [
    "tasks/**/*.yaml",
    "tasks/**/*.md",
    "compose-files/**/*.yaml",
    "compose-files/**/*.py",
    "deploy-files/**/*.yaml",
    "deploy-files/**/*.md",
    "deploy-files/**/*.txt",
    "deploy-files/**/.helmignore",
    "deploy-files/**/.gitignore",
]
