[build-system]
requires = ["setuptools>=64", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "artie-can"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
description = "Artie CAN library for communication over CAN bus"
dependencies = [
    "cffi>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/ also holds the C library's Unity suite, which CTest runs - the Python suite is the
# python/ subdirectory of it. run_tests.py is the entry point the artie-tool task uses.
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
