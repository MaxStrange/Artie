# Integration tests for the Artie CAN library.
#
# Where the unit tests run every node inside a single process (so frames never leave it), these run
# three nodes in three containers, talking over the UDP multicast backend across a Docker network.
# That is what exercises the wire format, the multicast join, and the backend's receiver thread
# between real peers.
#
# Compose hosts the two long-lived peer nodes (0x02 and 0x03); each test step below runs the same
# image as a one-shot driver node (0x01) that performs one scenario and decides its own pass/fail.
#
# Each step asserts twice: once on the driver's own verdict, and once on a peer's log, which is what
# proves the traffic actually crossed the container boundary rather than the driver passing itself.
name: can-integration-tests
labels:
  - docker-image
  - integration
  - library
dependencies:
  - artie-can-test-image: docker-image
type: test
steps:
  - job: docker-compose-test-suite
    compose-fname: compose.can.yaml
    compose-docker-image-variables:
      - ARTIE_CAN_TEST_IMAGE:
          dependency:
            name: docker-image
            producing-task: artie-can-test-image
    # The "CLI" image here is the CAN test image itself - the thing we run per step is the scenario
    # driver, not artie-cli.
    cli-image:
      dependency:
        name: docker-image
        producing-task: artie-can-test-image
    steps:
      # Warm-up: proves both peers are on the bus before anything else is asserted. The driver
      # retries internally, so this also absorbs the gap between compose reporting the containers
      # as up and the nodes actually having joined the multicast group.
      - test-name: nodes-ready
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario ping"
        expected-outputs:
          # Only the first artie-cli expectation is checked by the framework, so there is exactly
          # one per step; everything else is asserted in the peers' logs.
          - what: "ITEST ping:PASS"
            where: artie-cli
          - what: "NODE 0x02 RTACP RX from 0x01: PING01"
            where: can-itest-node-2
          - what: "NODE 0x03 RTACP RX from 0x01: PING01"
            where: can-itest-node-3

      # A unicast must reach its target and no one else. The negative half is checked inside the
      # driver (it listens for a stray answer from 0x03 and fails if one arrives) because
      # container-scoped unexpected-outputs are not wired up by artietool.
      - test-name: rtacp-unicast
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario rtacp-unicast"
        expected-outputs:
          - what: "ITEST rtacp-unicast:PASS"
            where: artie-cli
          - what: "NODE 0x02 RTACP RX from 0x01: RTUNI01"
            where: can-itest-node-2

      - test-name: rtacp-broadcast
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario rtacp-broadcast"
        expected-outputs:
          - what: "ITEST rtacp-broadcast:PASS"
            where: artie-cli
          - what: "NODE 0x02 RTACP RX from 0x01: RTBC01"
            where: can-itest-node-2
          - what: "NODE 0x03 RTACP RX from 0x01: RTBC01"
            where: can-itest-node-3

      # A 1 KB block spans many frames, so this covers the multi-frame READY/DATA/COMPLETE sequence
      # and its CRC check across the network. Unicast to 0x02, so 0x03 must stay out of it.
      - test-name: bwacp-block-transfer
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario bwacp-block-transfer"
        expected-outputs:
          - what: "ITEST bwacp-block-transfer:PASS"
            where: artie-cli
          - what: "NODE 0x02 BWACP RX 1024 bytes from 0x01 at offset 0"
            where: can-itest-node-2

      - test-name: psacp-publish-subscribe
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario psacp-publish-subscribe"
        expected-outputs:
          - what: "ITEST psacp-publish-subscribe:PASS"
            where: artie-cli
          - what: "NODE 0x02 PSACP RX topic 0x10 from 0x01: PSPUB01"
            where: can-itest-node-2
          - what: "NODE 0x03 PSACP RX topic 0x10 from 0x01: PSPUB01"
            where: can-itest-node-3

      # The peer's registered ECHO procedure returns its argument plus one; the driver checks the
      # returned value, so this covers the full request/return round trip.
      - test-name: rpcacp-call
        cmd-to-run-in-cli: "/artie-can/build/itest/itest_node --role driver --address 0x01 --scenario rpcacp-call"
        expected-outputs:
          - what: "ITEST rpcacp-call:PASS"
            where: artie-cli
          - what: "NODE 0x02 RPC ECHO(0x41) -> 0x42"
            where: can-itest-node-2
